name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify install and module integrity
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q src
          python -c "from src.parser.route_parser import parse_routes; from src.analysis.path_analyzer import analyze_path"

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: pytest tests/ -v --tb=short
